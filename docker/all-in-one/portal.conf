# 智盛 portal vhost for the all-in-one image.
#
# Apache listens on :8080 so the nginx.org nginx keeps :80 for the compiled
# React frontend and the /api, /v1 proxy. The portal is copied into this
# document root with its own layout intact, which is what keeps every absolute
# asset path in it (/vendor/..., /css/style.css, /views/..., /api.php) working
# without a source change.
<VirtualHost *:8080>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # The portal reads its configuration with getenv() in 智盛fontend/config.php.
    # These variables arrive in the container environment via Compose; PassEnv
    # copies them into the request environment so mod_php sees them both in
    # $_SERVER and through getenv(). Listing them explicitly keeps the contract
    # visible here instead of relying on process-environment inheritance.
    PassEnv RAGFLOW_BASE_URL
    PassEnv RAGFLOW_API_KEY
    PassEnv DB_HOST
    PassEnv DB_PORT
    PassEnv DB_NAME
    PassEnv DB_USER
    PassEnv DB_PASS
    PassEnv VIVARLY_ADMIN_USER
    PassEnv VIVARLY_ADMIN_PASSWORD
    PassEnv VIVARLY_ADMIN_EMAIL
    PassEnv DEBUG_MODE

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>