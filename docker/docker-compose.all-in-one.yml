# All-in-one override: publishes the 智盛 PHP portal that the application image
# serves on container port 8080.
#
# Apply this only to an image built with `--target all-in-one`, the only target
# that runs Apache + mod_php:
#
#   docker compose -f docker-compose.yml -f docker-compose.all-in-one.yml up -d
#
# docker-compose.yml alone is the default and publishes no portal port. The
# `production` target has no listener on 8080, so applying this file to it would
# publish a dead port.
#
# The VIVARLY_* names below are a contract: 智盛fontend/config.php reads them with
# getenv(), and docker/all-in-one/portal.conf passes them through. Do not rename.
services:
  ragflow-cpu:
    ports:
      - ${VIVARLY_PORT:-18080}:8080
    environment:
      PORTAL_HTTP_PORT: "8080"
      RAGFLOW_BASE_URL: http://127.0.0.1:9380
      RAGFLOW_API_KEY: ${VIVARLY_RAGFLOW_API_KEY:-}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${VIVARLY_DB_NAME:-vivarly_db}
      DB_USER: root
      DB_PASS: ${MYSQL_PASSWORD:-infini_rag_flow}
      VIVARLY_ADMIN_USER: ${VIVARLY_ADMIN_USER:-admin}
      VIVARLY_ADMIN_PASSWORD: ${VIVARLY_ADMIN_PASSWORD:-admin123}
      VIVARLY_ADMIN_EMAIL: ${VIVARLY_ADMIN_EMAIL:-admin@localhost}
      DEBUG_MODE: ${VIVARLY_DEBUG_MODE:-0}

  ragflow-gpu:
    ports:
      - ${VIVARLY_PORT:-18080}:8080
    environment:
      PORTAL_HTTP_PORT: "8080"
      RAGFLOW_BASE_URL: http://127.0.0.1:9380
      RAGFLOW_API_KEY: ${VIVARLY_RAGFLOW_API_KEY:-}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${VIVARLY_DB_NAME:-vivarly_db}
      DB_USER: root
      DB_PASS: ${MYSQL_PASSWORD:-infini_rag_flow}
      VIVARLY_ADMIN_USER: ${VIVARLY_ADMIN_USER:-admin}
      VIVARLY_ADMIN_PASSWORD: ${VIVARLY_ADMIN_PASSWORD:-admin123}
      VIVARLY_ADMIN_EMAIL: ${VIVARLY_ADMIN_EMAIL:-admin@localhost}
      DEBUG_MODE: ${VIVARLY_DEBUG_MODE:-0}