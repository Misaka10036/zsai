include:
  - ./docker-compose-base.yml
# To ensure that the container processes the locally modified `service_conf.yaml.template` instead of the one included in its image, you need to mount the local `service_conf.yaml.template` to the container.
services:
  deepdoc:
    image: ${DEEPDOC_IMAGE:-deepdoc_oss:latest}
    profiles:
      - deepdoc
    build:
      context: ..
      dockerfile: Dockerfile_deepdoc_oss
    networks:
      - ragflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9390/health"]
      interval: 10s
      timeout: 10s
      retries: 60

  ragflow-cpu:
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    profiles:
      - cpu
    image: ${RAGFLOW_IMAGE}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 65535
        hard: 65535
    # Example configuration to set up an MCP server:
    # command:
    #   - --enable-mcpserver
    #   - --mcp-host=0.0.0.0
    #   - --mcp-port=9382
    #   - --mcp-base-url=http://127.0.0.1:9380
    #   - --mcp-script-path=/ragflow/mcp/server/server.py
    #   - --mcp-mode=self-host
    #   - --mcp-host-api-key=ragflow-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    # Optional transport flags for MCP (customize if needed).
    # Host mode need to combined with --no-transport-streamable-http-enabled flag, namely, host+streamable-http is not supported yet.
    # The following are enabled by default unless explicitly disabled with --no-<flag>.
    #   - --no-transport-sse-enabled # Disable legacy SSE endpoints (/sse and /messages/)
    #   - --no-transport-streamable-http-enabled #  Disable Streamable HTTP transport (/mcp endpoint)
    #   - --no-json-response # Disable JSON response mode in Streamable HTTP transport (instead of SSE over HTTP)

    # Example configuration to start Admin server:
    command:
      - --enable-adminserver
      - --init-model-provider-tables
    ports:
      - ${SVR_WEB_HTTP_PORT}:80
      - ${SVR_WEB_HTTPS_PORT}:443
      - ${SVR_HTTP_PORT}:9380
      - ${ADMIN_SVR_HTTP_PORT}:9381
      - ${SVR_MCP_PORT}:9382 # entry for MCP (host_port:docker_port). The docker_port must match the value you set for `mcp-port` above.
      - ${GO_HTTP_PORT}:9384
      - ${GO_ADMIN_PORT}:9383
      # 智盛 PHP portal, served by Apache inside the all-in-one image target.
      # Inert on the production target, which has no listener on 8080.
      - ${VIVARLY_PORT:-18080}:8080
    environment:
      # Shared secret used to authenticate towards sandbox-executor-manager.
      # Must match SANDBOX_EXECUTOR_MANAGER_API_TOKEN on that service.
      - SANDBOX_EXECUTOR_MANAGER_API_TOKEN=${SANDBOX_EXECUTOR_MANAGER_API_TOKEN:-}
      # --- 智盛 portal (all-in-one image target) ---
      # The portal shares this container, so it reaches the Python API on the
      # loopback address rather than through the compose service name that the
      # standalone vivarly image uses.
      - PORTAL_HTTP_PORT=8080
      - RAGFLOW_BASE_URL=http://127.0.0.1:9380
      - RAGFLOW_API_KEY=${VIVARLY_RAGFLOW_API_KEY:-}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${VIVARLY_DB_NAME:-vivarly_db}
      - DB_USER=root
      - DB_PASS=${MYSQL_PASSWORD:-infini_rag_flow}
      - VIVARLY_ADMIN_USER=${VIVARLY_ADMIN_USER:-admin}
      - VIVARLY_ADMIN_PASSWORD=${VIVARLY_ADMIN_PASSWORD:-admin123}
      - VIVARLY_ADMIN_EMAIL=${VIVARLY_ADMIN_EMAIL:-admin@localhost}
      - DEBUG_MODE=${VIVARLY_DEBUG_MODE:-0}
    volumes:
      - ./ragflow-logs:/ragflow/logs
      # - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      # - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
    env_file: .env
    networks:
      - ragflow
    restart: unless-stopped
    # https://docs.docker.com/engine/daemon/prometheus/#create-a-prometheus-configuration
    # If you use Docker Desktop, the --add-host flag is optional. This flag ensures that the host's internal IP is exposed to the Prometheus container.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ragflow-gpu:
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    profiles:
      - gpu
    image: ${RAGFLOW_IMAGE}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 65535
        hard: 65535
    # Example configuration to set up an MCP server:
    # command:
    #   - --enable-mcpserver
    #   - --mcp-host=0.0.0.0
    #   - --mcp-port=9382
    #   - --mcp-base-url=http://127.0.0.1:9380
    #   - --mcp-script-path=/ragflow/mcp/server/server.py
    #   - --mcp-mode=self-host
    #   - --mcp-host-api-key=ragflow-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    # Optional transport flags for MCP (customize if needed).
    # Host mode need to combined with --no-transport-streamable-http-enabled flag, namely, host+streamable-http is not supported yet.
    # The following are enabled by default unless explicitly disabled with --no-<flag>.
    #   - --no-transport-sse-enabled # Disable legacy SSE endpoints (/sse and /messages/)
    #   - --no-transport-streamable-http-enabled #  Disable Streamable HTTP transport (/mcp endpoint)
    #   - --no-json-response # Disable JSON response mode in Streamable HTTP transport (instead of SSE over HTTP)

    # Example configuration to start Admin server:
    command:
      - --enable-adminserver
    ports:
      - ${SVR_WEB_HTTP_PORT}:80
      - ${SVR_WEB_HTTPS_PORT}:443
      - ${SVR_HTTP_PORT}:9380
      - ${ADMIN_SVR_HTTP_PORT}:9381
      - ${SVR_MCP_PORT}:9382 # entry for MCP (host_port:docker_port). The docker_port must match the value you set for `mcp-port` above.
      # 智盛 PHP portal, served by Apache inside the all-in-one image target.
      # Inert on the production target, which has no listener on 8080.
      - ${VIVARLY_PORT:-18080}:8080
    volumes:
      - ./ragflow-logs:/ragflow/logs
      # - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      # - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
    environment:
      # Shared secret used to authenticate towards sandbox-executor-manager.
      # Must match SANDBOX_EXECUTOR_MANAGER_API_TOKEN on that service.
      - SANDBOX_EXECUTOR_MANAGER_API_TOKEN=${SANDBOX_EXECUTOR_MANAGER_API_TOKEN:-}
      # --- 智盛 portal (all-in-one image target) ---
      # The portal shares this container, so it reaches the Python API on the
      # loopback address rather than through the compose service name that the
      # standalone vivarly image uses.
      - PORTAL_HTTP_PORT=8080
      - RAGFLOW_BASE_URL=http://127.0.0.1:9380
      - RAGFLOW_API_KEY=${VIVARLY_RAGFLOW_API_KEY:-}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${VIVARLY_DB_NAME:-vivarly_db}
      - DB_USER=root
      - DB_PASS=${MYSQL_PASSWORD:-infini_rag_flow}
      - VIVARLY_ADMIN_USER=${VIVARLY_ADMIN_USER:-admin}
      - VIVARLY_ADMIN_PASSWORD=${VIVARLY_ADMIN_PASSWORD:-admin123}
      - VIVARLY_ADMIN_EMAIL=${VIVARLY_ADMIN_EMAIL:-admin@localhost}
      - DEBUG_MODE=${VIVARLY_DEBUG_MODE:-0}
    env_file: .env
    networks:
      - ragflow
    restart: unless-stopped
    # https://docs.docker.com/engine/daemon/prometheus/#create-a-prometheus-scrape-configuration
    # If you use Docker Desktop, the --add-host flag is optional. This flag ensures that the host's internal IP is exposed to the Prometheus container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vivarly:
    profiles:
      - vivarly
    image: ${VIVARLY_IMAGE:-ragflow-vivarly:local}
    build:
      context: ./vivarly
      dockerfile: Dockerfile
      args:
        PHP_IMAGE: ${VIVARLY_PHP_IMAGE:-php:8.2-apache}
    # This standalone portal and the Apache inside the all-in-one application
    # image both bind VIVARLY_PORT. Use one or the other, never both: build the
    # all-in-one target without the `vivarly` profile, or target `production` to
    # keep this container. build_docker_bundle.ps1 rejects the combination.
    ports:
      - "0.0.0.0:${VIVARLY_PORT:-8080}:80"
    environment:
      RAGFLOW_BASE_URL: ${VIVARLY_RAGFLOW_BASE_URL:-http://ragflow-cpu}
      RAGFLOW_API_KEY: ${VIVARLY_RAGFLOW_API_KEY:-}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${VIVARLY_DB_NAME:-vivarly_db}
      DB_USER: root
      DB_PASS: ${MYSQL_PASSWORD}
      VIVARLY_ADMIN_USER: ${VIVARLY_ADMIN_USER:-admin}
      VIVARLY_ADMIN_PASSWORD: ${VIVARLY_ADMIN_PASSWORD:-admin123}
      VIVARLY_ADMIN_EMAIL: ${VIVARLY_ADMIN_EMAIL:-admin@localhost}
      DEBUG_MODE: ${VIVARLY_DEBUG_MODE:-0}
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ragflow
    restart: unless-stopped

